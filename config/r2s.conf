# 构建目标描述 —— 由 .github/workflows/build-image.yml 以 `. config/<名称>.conf` 方式加载。
# 新增目标 = 新增一个同格式的 <名称>.conf，workflow 无需改动。
#
# 本文件：FriendlyARM NanoPi R2S（友善 R2S，RK3328 / aarch64）
#   target 目录：downloads.openwrt.org/releases/<ver>/targets/rockchip/armv8/
#   profile 名  ：friendlyarm_nanopi-r2s（就是设备名，rockchip 是 multi-profile target）

# ---- 自声明身份：必须与本文件名的 <名称> 完全一致 ----
# 防止「复制 r2s.conf 改成别的名字却忘了改内容」这类静默错误。
CONF_ARCH="r2s"

# ---- OpenWrt target 三元组 ----
TARGET="rockchip"
SUBTARGET="armv8"
ARCH_PACKAGES="aarch64_generic"

# ---- ImageBuilder 压缩包名里用的两段 tag ----
# 完整文件名：openwrt-imagebuilder-<version>-<IB_ARCH_TAG>.<IB_HOST_TAG>.tar.zst
# rockchip/armv8 的官方包实际就叫 openwrt-imagebuilder-25.12.5-rockchip-armv8.Linux-x86_64.tar.zst
IB_ARCH_TAG="rockchip-armv8"
IB_HOST_TAG="Linux-x86_64"

# ---- 默认 profile ----
PROFILE="friendlyarm_nanopi-r2s"

# ---- 镜像规格 ----
ROOTFS_FS="ext4"
# R2S 官方默认 rootfs 分区是 104 MiB，这里放大到 1024 MiB。
# 该值写进 .config 的 CONFIG_TARGET_ROOTFS_PARTSIZE，由 pine64-img（gen_image_generic.sh）
# 决定分区 2 的扇区数 —— 与 x86 的 combined 走的是同一个脚本、同一套语义。
# 与已装系统保持一致才能走 sysupgrade 增量写、保住配置与扩容。
ROOTFS_SIZE="1024"
EXTRA_IMAGE_NAME="ext4-1g"

# ---- 发布到 Release 的产物变体 ----
# 只挑这一个变体上传；其余（squashfs-sysupgrade 等）留在 CI 不发布。
# R2S 没有 combined / combined-efi —— 那是 x86/armsr 的 GRUB 引导形态，
# rockchip 出的是含 u-boot 的整盘 sysupgrade 镜像。
RELEASE_VARIANT="ext4-sysupgrade"
VARIANT_DESC="ext4-sysupgrade（整盘镜像，含 u-boot，可直接写卡）"
FLASH_HINT="解压后整盘写入 microSD 卡即可启动（R2S 没有 eMMC，系统盘就是这张卡）"

# ---- 包集 ----
# 说明：
#   -dnsmasq dnsmasq-full  —— 必须成对出现。默认包集里已含 dnsmasq，而 dnsmasq 与
#                             dnsmasq-full 都 PROVIDES:=dnsmasq（提供同一 virtual），
#                             不显式移除前者会导致依赖解析冲突。
#   uboot-envtools
#   kmod-gpio-button-hotplug
#                          —— rockchip/armv8 的 Default-Packages 成员，显式列出以保证
#                             包集不随 profile 默认值变动。
#   kmod-usb-net-rtl8152   —— Device/friendlyarm_nanopi-r2s 的 DEVICE_PACKAGES：R2S 的
#                             第二个千兆口是 USB 上的 RTL8153，缺它就只有一个网口可用。
#   kmod-fs-vfat           —— 挂 U 盘用。
#   ⚠️ x86 那套 kmod-e1000*/igb/ixgbe/r8169/tg3/drm-i915 等对 aarch64 无意义，已全部去掉。
PACKAGES="-dnsmasq dnsmasq-full apk-mbedtls base-files ca-bundle dropbear e2fsprogs firewall4 fstools kmod-gpio-button-hotplug kmod-nft-offload libc libgcc libustream-mbedtls logd mkf2fs mtd netifd nftables odhcp6c odhcpd-ipv6only partx-utils ppp ppp-mod-pppoe procd-ujail uboot-envtools uci uclient-fetch urandom-seed urngd kmod-usb-net-rtl8152 kmod-fs-vfat luci luci-app-attendedsysupgrade kmod-nft-tproxy luci-i18n-base-zh-cn luci-i18n-ttyd-zh-cn luci-i18n-irqbalance-zh-cn ethtool luci-i18n-sqm-zh-cn luci-i18n-unbound-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn natmap luci-proto-wireguard"
