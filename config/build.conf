# ==========================================================================
# 默认构建目标 —— 版本号与架构的唯一事实源
#
#   改这个文件 → push 到 main → 自动重新构建并覆盖对应 Release。
#   手动触发 workflow_dispatch 时两项留空，同样取用这里的值。
#
#   纯 shell 赋值语法，会被 workflow 以 `. config/build.conf` 加载，
#   所以等号两侧不要加空格，值要加引号。
# ==========================================================================

# OpenWrt 官方发行版号（对应 downloads.openwrt.org/releases/<版本>/）
VERSION="25.12.5"

# 架构；必须存在同名配置文件 config/<架构>.conf
ARCH="x86_64"
