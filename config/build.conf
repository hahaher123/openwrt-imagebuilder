# ==========================================================================
# 默认构建目标 —— 版本号与目标的唯一事实源
#
#   改这个文件 → push 到 main → 自动重新构建并覆盖对应 Release。
#   手动触发 workflow_dispatch 时两项留空，同样取用这里的值。
#
#   纯 shell 赋值语法，会被 workflow 以 `. config/build.conf` 加载，
#   所以等号两侧不要加空格，值要加引号。
# ==========================================================================

# OpenWrt 官方发行版号（对应 downloads.openwrt.org/releases/<版本>/）
VERSION="25.12.5"

# 构建目标；必须存在同名配置文件 config/<目标>.conf。
# 取值是「架构」（如 x86_64）或「某架构下的具体设备」（如 r2s），看你出什么镜像：
#   x86_64  -> config/x86_64.conf   x86/64 通用镜像（ext4-combined-efi）
#   r2s     -> config/r2s.conf      友善 R2S，rockchip/armv8（ext4-sysupgrade）
ARCH="x86_64"
