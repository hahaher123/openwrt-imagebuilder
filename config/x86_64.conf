# 架构描述 —— 由 .github/workflows/build-image.yml 以 `. config/<arch>.conf` 方式加载。
# 新增架构 = 新增一个同格式的 <arch>.conf，workflow 无需改动。

# ---- 自声明身份：必须与本文件名的 <arch> 完全一致 ----
# 防止「复制 x86_64.conf 改成别的名字却忘了改内容」这类静默错误。
CONF_ARCH="x86_64"

# ---- OpenWrt target 三元组（对应 downloads.openwrt.org/releases/<ver>/targets/<TARGET>/<SUBTARGET>） ----
TARGET="x86"
SUBTARGET="64"
ARCH_PACKAGES="x86_64"

# ---- ImageBuilder 压缩包名里用的两段 tag ----
# 完整文件名：openwrt-imagebuilder-<version>-<IB_ARCH_TAG>.<IB_HOST_TAG>.tar.zst
IB_ARCH_TAG="x86-64"
IB_HOST_TAG="Linux-x86_64"

# ---- 默认 profile ----
PROFILE="generic"

# ---- 镜像规格 ----
ROOTFS_FS="ext4"
# ROOTFS_SIZE 直接决定分区 2 的扇区数（= MiB x 2048），改它 = 改分区表。
# 与已装系统保持一致才能走 sysupgrade 增量写、保住配置与扩容。
ROOTFS_SIZE="1024"
EXTRA_IMAGE_NAME="ext4-1g"

# ---- 出厂 LAN 地址 ----
# 写进镜像的 /etc/uci-defaults/99-lan-ip，设备首次启动时把 OpenWrt 默认的
# 192.168.1.1 改成这个值（用户自己改过的地址不会被覆盖）。
# 各 target 分设：x86 软路由与 R2S 可能同处一个局域网，用同一个地址会撞 IP。
LAN_IP="192.168.100.1"

# ---- 发布到 Release 的产物变体 ----
# 只挑这一个变体上传；其余（squashfs-combined 等）留在 CI 不发布。
# 各 target 的变体名不同：x86 是 combined / combined-efi（GRUB），
# rockchip 是 sysupgrade（u-boot 整盘镜像），所以必须按目标配置而不能写死在 workflow 里。
RELEASE_VARIANT="ext4-combined-efi"
VARIANT_DESC="ext4-combined-efi（GPT + EFI 启动的整盘镜像）"
FLASH_HINT="解压后写入 U 盘、SSD 或虚拟机磁盘即可引导"

# ---- 额外包（全部来自官方源；含 kmods feed，IB 自带该源无需手工添加） ----
# 说明：
#   -dnsmasq dnsmasq-full  —— 必须成对出现。默认包集里已含 dnsmasq，而 dnsmasq 与
#                             dnsmasq-full 都 PROVIDES:=dnsmasq（提供同一 virtual），
#                             不显式移除前者会导致依赖解析冲突。
#   kmod-* 一排             —— 与官方 generic profile 的 Target-Profile-Packages 相同，
#                             显式列出仅为保证包集不随 profile 默认值变动。
#   luci-nginx              —— Web 服务改用 nginx：luci-nginx 是官方 collection，功能集与
#                             luci 完全一致（同样是 luci-app-package-manager + luci-mod-admin-full
#                             + firewall + bootstrap + rpcd-mod-rrdns），唯一差别是把
#                             uhttpd + uhttpd-mod-ubus 换成 nginx + nginx-mod-luci，
#                             LuCI 经由 uwsgi 跑（/var/run/luci-webui.socket）。
#   nginx-ssl               —— luci-nginx 依赖的是虚拟包 nginx，而 nginx-ssl 与 nginx-full
#                             都 PROVIDES nginx；显式钉住 SSL 变体，免得解析器挑到体积大得多的
#                             nginx-full（它把 geoip2/lua/rtmp/naxsi/brotli 等模块全编进去）。
#                             nginx-ssl 自带 nginx-ssl-util，负责生成自签证书与 LAN 监听配置。
#   -uhttpd -uhttpd-mod-ubus—— uhttpd 与 nginx 都要占 80/443，二者不能共存（官方文档明说）。
#                             luci-nginx 本就不依赖 uhttpd，这里显式移除是防御性的：
#                             万一默认包集或某个自建包把它带回来，端口冲突会让管理页直接打不开。
PACKAGES="-uhttpd -uhttpd-mod-ubus -dnsmasq dnsmasq-full apk-mbedtls base-files ca-bundle dropbear e2fsprogs firewall4 fstools grub2-bios-setup kmod-button-hotplug kmod-nft-offload libc libgcc libustream-mbedtls logd mkf2fs mtd netifd nftables odhcp6c odhcpd-ipv6only partx-utils ppp ppp-mod-pppoe procd-ujail uci uclient-fetch urandom-seed urngd kmod-amazon-ena kmod-amd-xgbe kmod-bnx2 kmod-dwmac-intel kmod-e1000e kmod-e1000 kmod-forcedeth kmod-fs-vfat kmod-igb kmod-igc kmod-ixgbe kmod-r8169 kmod-tg3 kmod-drm-i915 luci-nginx nginx-ssl luci-app-attendedsysupgrade kmod-ixgbevf kmod-nft-tproxy luci-i18n-base-zh-cn luci-i18n-ttyd-zh-cn luci-i18n-irqbalance-zh-cn ethtool luci-i18n-sqm-zh-cn luci-i18n-unbound-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn natmap luci-proto-wireguard"

# ---- 自建包与第三方包：从各自仓库的最新 Release 取 .apk，装进镜像 ----
# 每行一条，格式为 `owner/repo|资产名 glob`（glob 用 fnmatch 通配，
# ${ARCH_PACKAGES} 在加载本文件时已展开）。资产可以直接是 .apk，也可以是
# 内含 .apk 的 .tar.gz 归档 —— scripts/fetch-custom-packages.py 两种都能处理，
# 所以这里不用区分（sirpdboy 的 ddns-go 就是每架构一个 tar.gz）。
#
# 取的是各仓库的 latest Release，脚本会自动跟到最新版；每个包都会按目标
# 架构校验（arch 必须是 noarch 或 ARCH_PACKAGES），拿错架构会直接失败。
# 包名由脚本从 apk 元数据里读出，自动并入 PACKAGES=，无需在此重复列举。
CUSTOM_ASSETS="
hahaher123/openwrt-mihomo|luci-app-mihomo-*.apk
hahaher123/openwrt-mihomo|mihomo-*_${ARCH_PACKAGES}.apk
hahaher123/luci-app-natmap|luci-app-natmap-*.apk
hahaher123/luci-app-natmap|luci-i18n-natmap-zh-cn-*.apk
hahaher123/luci-app-oxidns|luci-app-oxidns-*.apk
hahaher123/luci-app-oxidns|luci-i18n-oxidns-zh-cn-*.apk
hahaher123/openwrt-oxidns|oxidns-*.apk
sirpdboy/luci-app-ddns-go|SNAPSHOT-${ARCH_PACKAGES}.tar.gz
"
