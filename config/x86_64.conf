# 架构描述 —— 由 .github/workflows/build-image.yml 以 `. config/<arch>.conf` 方式加载。
# 新增架构 = 新增一个同格式的 <arch>.conf，workflow 无需改动。

# ---- 自声明身份：必须与本文件名的 <arch> 完全一致 ----
# 防止「复制 x86_64.conf 改成别的名字却忘了改内容」这类静默错误。
CONF_ARCH="x86_64"

# ---- OpenWrt target 三元组（对应 downloads.openwrt.org/releases/<ver>/targets/<TARGET>/<SUBTARGET>） ----
TARGET="x86"
SUBTARGET="64"
ARCH_PACKAGES="x86_64"

# ---- ImageBuilder 压缩包名里用的两段 tag ----
# 完整文件名：openwrt-imagebuilder-<version>-<IB_ARCH_TAG>.<IB_HOST_TAG>.tar.zst
IB_ARCH_TAG="x86-64"
IB_HOST_TAG="Linux-x86_64"

# ---- 默认 profile ----
PROFILE="generic"

# ---- 镜像规格 ----
# ROOTFS_SIZE 直接决定分区 2 的扇区数（= MiB x 2048），改它 = 改分区表。
# 与已装系统保持一致才能走 sysupgrade 增量写、保住配置与扩容。
ROOTFS_SIZE="1024"
EXTRA_IMAGE_NAME="ext4-1g"

# ---- 额外包（全部来自官方源；含 kmods feed，IB 自带该源无需手工添加） ----
# 说明：
#   -dnsmasq dnsmasq-full  —— 必须成对出现。默认包集里已含 dnsmasq，而 dnsmasq 与
#                             dnsmasq-full 都 PROVIDES:=dnsmasq（提供同一 virtual），
#                             不显式移除前者会导致依赖解析冲突。
#   kmod-* 一排             —— 与官方 generic profile 的 Target-Profile-Packages 相同，
#                             显式列出仅为保证包集不随 profile 默认值变动。
PACKAGES="-dnsmasq dnsmasq-full apk-mbedtls base-files ca-bundle dropbear e2fsprogs firewall4 fstools grub2-bios-setup kmod-button-hotplug kmod-nft-offload libc libgcc libustream-mbedtls logd mkf2fs mtd netifd nftables odhcp6c odhcpd-ipv6only partx-utils ppp ppp-mod-pppoe procd-ujail uci uclient-fetch urandom-seed urngd kmod-amazon-ena kmod-amd-xgbe kmod-bnx2 kmod-dwmac-intel kmod-e1000e kmod-e1000 kmod-forcedeth kmod-fs-vfat kmod-igb kmod-igc kmod-ixgbe kmod-r8169 kmod-tg3 kmod-drm-i915 luci luci-app-attendedsysupgrade kmod-ixgbevf kmod-nft-tproxy luci-i18n-base-zh-cn luci-i18n-ttyd-zh-cn luci-i18n-irqbalance-zh-cn ethtool luci-i18n-sqm-zh-cn luci-i18n-unbound-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn natmap luci-proto-wireguard"
