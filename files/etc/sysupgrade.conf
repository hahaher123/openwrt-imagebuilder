## This file contains files and directories that should
## be preserved during an upgrade.
##
## 本文件由镜像出厂提供：openwrt-imagebuilder/files/etc/sysupgrade.conf
## 它只补充「整个目录」这一级策略；包自带的条目仍来自 /lib/upgrade/keep.d/*，
## 两者取并集，互不覆盖。
## 注意：目录条目由 sysupgrade 递归打包 —— 目录里的 .mmdb / cache.db 这类
## 大文件同样会进 /tmp/sysupgrade.tgz。

# /etc/example.conf

# mihomo 整目录：config.yaml（用户配置）+ config.sh（生成脚本）+ ruleset/
# + ui/ 定制 + sources + clash.nft / tproxy.sh。
# 包自带的 keep.d 只保 config.yaml，其余在整 sysupgrade 后会丢。
# ⚠️ 体积代价：目录内 ASN.mmdb(8.9M) + Country.mmdb(7.6M) + cache.db 一起进 tar，
# 备份包约 33 MB（x86 的 /tmp 是内存盘，R2S 1 GB 内存也放得下）。
/etc/mihomo/

# oxidns 整目录：config.yaml + rule/*.txt（分流规则，手工或 WebUI 维护）。
# 包的 keep.d 已列同一条目，这里是镜像级兜底：即使包的 keep.d 被换掉或漏装，
# 规则也不会在升级时被清空。
/etc/oxidns/
