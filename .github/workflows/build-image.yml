name: Build OpenWrt image

# 触发方式
#   1) workflow_dispatch —— 手动指定版本号 + 架构；两项留空即取 config/build.conf
#   2) push 到 main 且改动 config/**、files/**、scripts/** 或本文件 —— 直接用
#      config/build.conf 构建
#
# scripts/ 在触发范围内：fetch-custom-packages.py 决定自建包能不能正确落进
# packages/，它一改就必须重建（漏了它会出现「改了脚本但没人重编」的静默空窗）。
#
# 默认构建目标（版本号 + 架构）在整个仓库里只有一处定义：config/build.conf。
# 改那一个文件的两行，push 后就会重编并覆盖 Release；本文件无需再动。
# 与 target 相关的规格（IB 包名 tag、profile、rootfs 尺寸、出厂 LAN 地址、
# 要发布的产物变体名、Release 文案）全部在 config/<arch>.conf 里 —— 各 target
# 的产物形态不同（x86 出 ext4-combined-efi，rockchip 出 ext4-sysupgrade），
# 所以本文件里不出现任何具体变体名或架构名。
# files/ 是打进镜像的覆盖层（ImageBuilder 的 FILES=<dir>），里面的 __LAN_IP__
# 占位符在构建时替换成 config/<arch>.conf 的 LAN_IP。
# 注意：Actions 不允许 workflow_dispatch 的 default / options 引用变量或文件，
# 所以这两项只能留空，值统一由 build.conf 决定。
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 版本号，形如 25.12.x（留空 = 用 config/build.conf 的 VERSION）"
        required: false
        default: ""
      arch:
        description: "架构，需存在 config/<架构>.conf（留空 = 用 config/build.conf 的 ARCH）"
        required: false
        default: ""
      profile:
        description: "Target profile (blank = use config default)"
        required: false
        default: ""
      rootfs_size:
        description: "rootfs partition size in MiB (blank = use config default)"
        required: false
        default: ""
      lan_ip:
        description: "Default LAN address baked into the image (blank = use config default)"
        required: false
        default: ""
      extra_image_name:
        description: "EXTRA_IMAGE_NAME, the filename tag (blank = use config default)"
        required: false
        default: ""
      packages:
        description: "Extra packages, space separated (blank = use config default)"
        required: false
        default: ""
      publish:
        description: "Publish the image variant named by RELEASE_VARIANT in config/<arch>.conf to a GitHub Release"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "config/**"
      - "files/**"
      - "scripts/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_CONF: "config/build.conf"
  IB_MIRROR: "https://downloads.openwrt.org"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: cfg
        shell: bash
        env:
          IN_VERSION: ${{ inputs.openwrt_version }}
          IN_ARCH: ${{ inputs.arch }}
          IN_PROFILE: ${{ inputs.profile }}
          IN_SIZE: ${{ inputs.rootfs_size }}
          IN_EXTRA: ${{ inputs.extra_image_name }}
          IN_PKGS: ${{ inputs.packages }}
          IN_LAN_IP: ${{ inputs.lan_ip }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          # ---- 版本号与架构：唯一来源 ----
          if [ ! -f "$BUILD_CONF" ]; then
            echo "::error::missing ${BUILD_CONF} - it defines the default version and arch"
            exit 1
          fi
          # shellcheck source=/dev/null
          . "$BUILD_CONF"
          echo "--- defaults from ${BUILD_CONF} ---"
          grep -E '^[[:space:]]*(VERSION|ARCH)=' "$BUILD_CONF" || true

          ver="$(printf '%s' "${IN_VERSION:-}" | tr -d '[:space:]')"
          [ -n "$ver" ] || ver="${VERSION:-}"
          if [ -z "$ver" ]; then
            echo "::error::no version: workflow input is empty and ${BUILD_CONF} has no VERSION"
            exit 1
          fi

          arch="$(printf '%s' "${IN_ARCH:-}" | tr -d '[:space:]')"
          [ -n "$arch" ] || arch="${ARCH:-}"
          if [ -z "$arch" ]; then
            echo "::error::no arch: workflow input is empty and ${BUILD_CONF} has no ARCH"
            exit 1
          fi

          conf="config/${arch}.conf"
          if [ ! -f "$conf" ]; then
            echo "::error::unknown arch '${arch}' - no such file: ${conf}"
            ls -1 config/
            exit 1
          fi
          # shellcheck source=/dev/null
          . "$conf"

          if [ "${CONF_ARCH:-}" != "$arch" ]; then
            echo "::error::${conf} declares CONF_ARCH='${CONF_ARCH:-}' but was selected as arch '${arch}'"
            exit 1
          fi

          # 目标相关字段必须齐全。产物变体名（RELEASE_VARIANT）各 target 不同，
          # 所以它跟其它规格一样由 config/<arch>.conf 决定，不再写死在本文件里。
          for v in TARGET SUBTARGET ARCH_PACKAGES IB_ARCH_TAG IB_HOST_TAG PROFILE \
                   ROOTFS_SIZE ROOTFS_FS EXTRA_IMAGE_NAME RELEASE_VARIANT \
                   VARIANT_DESC FLASH_HINT LAN_IP PACKAGES; do
            eval "val=\${${v}:-}"
            if [ -z "$val" ]; then
              echo "::error::${conf} is missing required variable ${v}"
              exit 1
            fi
          done

          profile="$(printf '%s' "${IN_PROFILE:-}" | tr -d '[:space:]')"
          [ -n "$profile" ] || profile="$PROFILE"

          size="$(printf '%s' "${IN_SIZE:-}" | tr -d '[:space:]')"
          [ -n "$size" ] || size="$ROOTFS_SIZE"
          case "$size" in
            '' | *[!0-9]*)
              echo "::error::rootfs_size must be an integer number of MiB, got '${size}'"
              exit 1
              ;;
          esac

          extra="$(printf '%s' "${IN_EXTRA:-}" | tr -d '[:space:]')"
          [ -n "$extra" ] || extra="$EXTRA_IMAGE_NAME"

          lan_ip="$(printf '%s' "${IN_LAN_IP:-}" | tr -d '[:space:]')"
          [ -n "$lan_ip" ] || lan_ip="$LAN_IP"
          if [ -z "$lan_ip" ]; then
            echo "::error::no LAN_IP: workflow input is empty and ${conf} has no LAN_IP"
            exit 1
          fi
          # 这个值会被写进 files/etc/uci-defaults/99-lan-ip（单引号赋值），
          # 必须是干净的 IPv4 字面量，否则会写出语法坏掉的脚本或注入内容。
          if ! printf '%s' "$lan_ip" | awk -F. '
                NF != 4 { exit 1 }
                {
                  for (i = 1; i <= 4; i++)
                    if ($i !~ /^[0-9][0-9]{0,2}$/ || $i + 0 > 255) exit 1
                }'; then
            echo "::error::LAN_IP is not a valid IPv4 address: '${lan_ip}'"
            exit 1
          fi

          pkgs="$(printf '%s' "${IN_PKGS:-}" | tr '\n\r\t' '   ' | tr -s ' ')"
          [ -n "$pkgs" ] || pkgs="$PACKAGES"

          publish="${IN_PUBLISH:-}"
          case "$publish" in
            '') publish="true" ;;
            true | false) : ;;
            *)
              echo "::error::publish must be true or false, got '${publish}'"
              exit 1
              ;;
          esac

          ib_name="openwrt-imagebuilder-${ver}-${IB_ARCH_TAG}.${IB_HOST_TAG}.tar.zst"
          ib_dir="${ib_name%.tar.zst}"
          ib_url="${IB_MIRROR}/releases/${ver}/targets/${TARGET}/${SUBTARGET}/${ib_name}"
          tag="v${ver}-${arch}"

          {
            echo "version=${ver}"
            echo "arch=${arch}"
            echo "target=${TARGET}"
            echo "subtarget=${SUBTARGET}"
            echo "profile=${profile}"
            echo "rootfs_size=${size}"
            echo "extra_image_name=${extra}"
            echo "lan_ip=${lan_ip}"
            echo "rootfs_fs=${ROOTFS_FS}"
            echo "release_variant=${RELEASE_VARIANT}"
            echo "variant_desc=${VARIANT_DESC}"
            echo "flash_hint=${FLASH_HINT}"
            echo "ib_name=${ib_name}"
            echo "ib_dir=${ib_dir}"
            echo "ib_url=${ib_url}"
            echo "tag=${tag}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "packages<<__PACKAGES_EOF__"
            echo "$pkgs"
            echo "__PACKAGES_EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "=== resolved parameters ==="
          echo "version     : ${ver}"
          echo "arch        : ${arch}   (target ${TARGET}/${SUBTARGET})"
          echo "profile     : ${profile}"
          echo "rootfs size : ${size} MiB"
          echo "extra name  : ${extra}"
          echo "lan ip      : ${lan_ip}"
          echo "rootfs fs   : ${ROOTFS_FS}"
          echo "release var.: ${RELEASE_VARIANT}   (only this variant is published)"
          echo "release tag : ${tag}"
          echo "publish     : ${publish}"
          echo "imagebuilder: ${ib_url}"
          echo "packages    : ${pkgs}"

      - name: Download ImageBuilder
        shell: bash
        env:
          IB_URL: ${{ steps.cfg.outputs.ib_url }}
          IB_NAME: ${{ steps.cfg.outputs.ib_name }}
        run: |
          set -euo pipefail
          mkdir -p ib
          cd ib
          base="$(dirname "$IB_URL")"
          echo "GET ${base}/${IB_NAME}"
          curl -fSL --retry 3 --retry-delay 5 -o "$IB_NAME" "${base}/${IB_NAME}"
          curl -fSL --retry 3 --retry-delay 5 -o sha256sums "${base}/sha256sums"

          expected="$(awk -v f="$IB_NAME" '$2 == f || $2 == "*" f { print $1 }' sha256sums)"
          actual="$(sha256sum "$IB_NAME" | cut -d' ' -f1)"
          if [ -z "$expected" ]; then
            echo "::error::${IB_NAME} is not listed in the official sha256sums"
            exit 1
          fi
          echo "official sha256 : ${expected}"
          echo "downloaded sha256: ${actual}"
          if [ "$expected" != "$actual" ]; then
            echo "::error::sha256 mismatch - refusing to build with a tampered archive"
            exit 1
          fi
          echo "archive size: $(du -h "$IB_NAME" | cut -f1)"

      - name: Extract ImageBuilder
        shell: bash
        env:
          IB_NAME: ${{ steps.cfg.outputs.ib_name }}
          IB_DIR: ${{ steps.cfg.outputs.ib_dir }}
        run: |
          set -euo pipefail
          tar --zstd -xf "ib/${IB_NAME}" -C ib
          if [ ! -d "ib/${IB_DIR}" ]; then
            echo "::error::unexpected archive layout, expected dir ib/${IB_DIR}"
            ls -la ib
            exit 1
          fi
          echo "--- package repositories baked into this ImageBuilder ---"
          cat "ib/${IB_DIR}/repositories"
          echo
          echo "--- target profiles ---"
          ( cd "ib/${IB_DIR}" && make info 2>/dev/null | sed -n '1,30p' ) || true

      - name: Patch ImageBuilder
        # 修 IB 的一个变量泄漏 bug（openwrt-25.12 与 main 分支的代码完全一样）：
        #
        #   define FormatPackages
        #   $(strip $(foreach pkg,$(strip $(subst ",,$(1))),
        #     $(eval pkg_name:=$(firstword $(subst =, ,$(pkg))))
        #     $(if $(findstring =,$(pkg)),$(eval pkg_ver:==$(lastword $(subst =, ,$(pkg)))))
        #     $(pkg_name)$(call GetABISuffix,$(pkg_name))$(pkg_ver)
        #   ))
        #   endef
        #
        # pkg_ver 从不复位：列表里出现第一处 `pkg=version` 之后，**后面每个没有 `=`
        # 的条目都会继承那个版本**。BUILD_PACKAGES 的顺序是
        # [USER_PACKAGES] + [排序后的默认包] + [base-files/libc/kernel]，
        # 而自建包是带版本 pin 的（见 scripts/fetch-custom-packages.py），于是排在
        # 后面的整个默认包集都被染上最后一个 pin 的版本，apk 直接报
        #   ERROR: unable to select packages:
        #     e2fsprogs-1.47.3-r1: breaks: world[e2fsprogs=1.5.2-r1]
        # （实测 run 35496130706；1.5.2-r1 正是字母序最后一个 pin oxidns 的版本）。
        #
        # 补一句复位即恢复原意。锚点必须唯一命中，对不上就报错退出 ——
        # 免得上游改了这段之后补丁静默失效。上游修好后本补丁可直接删掉。
        #
        # 补丁 2：APK 变量加全局 --force-overwrite。
        #
        # 自建 luci-app-natmap 是全家桶设计：自带 etc/config/natmap 与
        # etc/init.d/natmap（插件体系由它自己的 init 脚本驱动），二进制则靠
        # LUCI_DEPENDS 的 +natmap 从官方源拉。官方 natmap 包同样拥有这两个
        # 文件，而 apk v3 对跨包文件覆盖是硬错误：
        #   ERROR: luci-app-natmap-1.5.10-r3: trying to overwrite
        #   etc/config/natmap owned by natmap-20260214-r1.（实测 run 35496363324）
        # apk v3 的正道是包元数据里声明 replaces（package.c 的
        # apk_pkg_replaces_file：声明方可静默接管文件，两种安装顺序都不报错），
        # 但 OpenWrt 打包系统（package-pack.mk 的 apk mkpkg 调用）不输出
        # replaces 字段，SDK 编出的包带不上 —— 只能在安装侧放行。
        # 依赖顺序保证 natmap 先于 luci-app-natmap 解包，冲突时后者（我们的
        # 文件）赢；冲突从错误降级为 warning（日志里仍可见）。代价：今后任何
        # 包间文件冲突都不再阻断构建，包级错装仍由 manifest 校验（名字+版本）
        # 兜底。若以后自建包都能自带 replaces 元数据，本补丁可删。
        shell: bash
        env:
          IB_DIR: ${{ steps.cfg.outputs.ib_dir }}
        run: |
          set -euo pipefail
          makefile="ib/${IB_DIR}/Makefile"
          if [ ! -f "$makefile" ]; then
            echo "::error::找不到 $makefile"
            exit 1
          fi
          python3 - "$makefile" <<'PYEOF'
          import io
          import sys

          path = sys.argv[1]
          with io.open(path, encoding="utf-8") as fh:
              lines = fh.readlines()

          changed = False

          def sole(anchor, what):
              hits = [i for i, line in enumerate(lines) if anchor in line]
              if len(hits) != 1:
                  sys.exit("::error::在 %s 里 %d 次命中 %s 的锚点（应为 1 次）—— "
                           "IB 的 Makefile 变了，需要重新核对再改本步骤"
                           % (path, len(hits), what))
              return hits[0]

          # 补丁 1：FormatPackages 的 pkg_ver 复位（变量泄漏，见步骤头注释）
          i = sole("$(eval pkg_name:=$(firstword $(subst =, ,$(pkg))))", "FormatPackages")
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          if any("pkg_ver:=)" in line for line in lines[i:i + 3]):
              print("补丁 1（pkg_ver 复位）已存在，跳过")
          else:
              lines.insert(i + 1, indent + "$(eval pkg_ver:=)\n")
              changed = True
              print("补丁 1：已插入 pkg_ver 复位")

          # 补丁 2：apk 全局 --force-overwrite（natmap 文件冲突，见步骤头注释）
          j = sole("--cache-dir $(DL_DIR)", "APK 变量")
          if "--force-overwrite" in lines[j]:
              print("补丁 2（--force-overwrite）已存在，跳过")
          else:
              lines[j] = lines[j].rstrip("\n") + " --force-overwrite\n"
              changed = True
              print("补丁 2：APK 变量尾行已追加 --force-overwrite")

          # 任一锚点失配都会在上面直接退出 —— 到这里的改动才落盘，保证原子性
          if changed:
              with io.open(path, "w", encoding="utf-8", newline="") as fh:
                  fh.writelines(lines)
          PYEOF
          echo "--- 打过补丁的 FormatPackages ---"
          sed -n '/^define FormatPackages/,/^endef/p' "$makefile"
          echo "--- 打过补丁的 APK 变量 ---"
          sed -n '/^APK:=/,/^$/p' "$makefile"
          patched="$(sed -n '/^define FormatPackages/,/^endef/p' "$makefile" | grep -c 'pkg_ver:=)')"
          if [ "$patched" -lt 1 ]; then
            echo "::error::补丁 1 没生效（FormatPackages 里没看到 pkg_ver 复位）"
            exit 1
          fi
          if ! grep -q -- '--cache-dir $(DL_DIR) --force-overwrite$' "$makefile"; then
            echo "::error::补丁 2 没生效（APK 变量尾行没有 --force-overwrite）"
            exit 1
          fi

      - name: Fetch packages from our own repositories
        id: custom
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ steps.cfg.outputs.arch }}
          IB_DIR: ${{ steps.cfg.outputs.ib_dir }}
        run: |
          set -euo pipefail
          conf="config/${ARCH}.conf"
          # shellcheck source=/dev/null
          . "$conf"

          # 每个 target 要装哪些自建包，写在它自己的 conf 的 CUSTOM_ASSETS 里
          # （格式见该文件注释）。没有这个变量就等于该目标不装自建包。
          if [ -z "${CUSTOM_ASSETS:-}" ]; then
            echo "config/${ARCH}.conf has no CUSTOM_ASSETS - nothing to fetch"
            echo "custom_pkgs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ⚠️ `. conf` 只是设 shell 变量、**不导出**，而下面的 python 读的是
          # os.environ ⇒ 不显式 export 它会拿到空值，打印「CUSTOM_ASSETS 为空」
          # 然后正常返回 0 —— 镜像里一个自建包都没有，却一路绿灯（真踩过）。
          export CUSTOM_ASSETS ARCH_PACKAGES

          # ImageBuilder 根目录的 packages/ 是官方留给本地包的位置：把 .apk 放进去，
          # make image 会自动用 apk mkndx 建索引并装上（见 packages/README.md）。
          # 脚本取各仓库的 latest Release，校验每个包的 ADB v3 格式与目标架构。
          mkdir -p "ib/${IB_DIR}/packages"
          python3 scripts/fetch-custom-packages.py \
            --dest "ib/${IB_DIR}/packages" \
            --out-env custom-packages.env

          # shellcheck source=/dev/null
          . ./custom-packages.env
          # conf 声明了来源却一个包都没抓到，说明上面的通道又断了 —— 必须报错，
          # 否则「Verify the custom packages are in the image」会因 custom_pkgs
          # 为空被静默跳过，缺包永远暴露不出来。
          if [ -z "${CUSTOM_PKGS:-}" ]; then
            echo "::error::${ARCH} 声明了 CUSTOM_ASSETS，但没有抓到任何自建包"
            exit 1
          fi
          echo "custom_pkgs=${CUSTOM_PKGS}" >> "$GITHUB_OUTPUT"
          echo "--- 以下自建包会并入 PACKAGES ---"
          echo "${CUSTOM_PKGS}"

      - name: Prepare files overlay
        id: files
        shell: bash
        env:
          LAN_IP_IN: ${{ steps.cfg.outputs.lan_ip }}
        run: |
          set -euo pipefail

          # files/ 是打进镜像的覆盖层（ImageBuilder 的 FILES=<dir>）：
          # include/rootfs.mk 的 prepare_rootfs 会执行
          #     $(call file_copy,$(2)/.,$(1))
          # 把这个目录的内容整体拷进 rootfs，且紧随其后的 rm -rf 清单不碰
          # /etc/uci-defaults —— 所以落在那里的脚本会留到设备首次启动才执行。
          #
          # 其中的 __LAN_IP__ 占位符在这里替换成 config/<arch>.conf 的 LAN_IP，
          # 保持「出厂 LAN 地址」只有一处事实源。
          dst="$GITHUB_WORKSPACE/ib/files"
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a files/. "$dst/"

          target="$dst/etc/uci-defaults/99-lan-ip"
          if [ ! -f "$target" ]; then
            echo "::error::files/etc/uci-defaults/99-lan-ip 不存在"
            find "$dst" -type f -printf '%P\n' || true
            exit 1
          fi

          sed -i "s|__LAN_IP__|${LAN_IP_IN}|g" "$target"
          if grep -q '__LAN_IP__' "$target"; then
            echo "::error::__LAN_IP__ 占位符没有被替换"
            exit 1
          fi
          # uci-defaults 脚本由 /etc/init.d/boot 以 source 方式执行，不依赖执行位；
          # 仍然补上 0755，免得将来换成直接执行时踩坑。
          chmod 0755 "$target"

          # 两道静态守卫：语法错、或误用 exit/return（被 source 时会牵连调用方
          # 子 shell，且末尾返回非 0 会让脚本留在原地反复重跑）都会在设备上才暴露，
          # 所以在这里就拦住。
          sh -n "$target"
          if grep -nE '^[[:space:]]*(exit|return)([[:space:]]|$)' "$target"; then
            echo "::error::uci-defaults 脚本不能使用 exit / return（它会被 source 执行）"
            exit 1
          fi

          echo "--- 覆盖层内容 ---"
          find "$dst" -type f -printf '%M  %P\n' | sort
          echo "--- ${target} ---"
          sed 's/^/    /' "$target"
          echo "files_dir=$dst" >> "$GITHUB_OUTPUT"

      - name: Build image
        shell: bash
        working-directory: ib/${{ steps.cfg.outputs.ib_dir }}
        env:
          PROFILE_IN: ${{ steps.cfg.outputs.profile }}
          SIZE_IN: ${{ steps.cfg.outputs.rootfs_size }}
          EXTRA_IN: ${{ steps.cfg.outputs.extra_image_name }}
          FILES_IN: ${{ steps.files.outputs.files_dir }}
          PKGS: ${{ steps.cfg.outputs.packages }} ${{ steps.custom.outputs.custom_pkgs }}
        run: |
          set -euo pipefail
          echo "--- disk before ---"
          df -h . | tail -1
          echo "--- make image ---"
          # ADD_LOCAL_KEY=1：把本次构建自动生成的本地签名公钥（keys/local-public-key.pem）
          # 一并放进镜像的 /etc/apk/keys/，这样设备上以后 apk add 时能直接信任用
          # 同一把私钥签名的本地索引，不必每次加 --allow-untrusted。
          # （密钥由 image: 依赖的 _check_keys 自动生成，见官方 ImageBuilder Makefile。）
          #
          # FILES=<dir>：把该目录内容覆盖进 rootfs（出厂 LAN 地址就靠它）。
          make image \
            PROFILE="$PROFILE_IN" \
            PACKAGES="$PKGS" \
            ROOTFS_PARTSIZE="$SIZE_IN" \
            EXTRA_IMAGE_NAME="$EXTRA_IN" \
            FILES="$FILES_IN" \
            ADD_LOCAL_KEY=1 \
            -j"$(nproc)" 2>&1 | tee build.log
          echo "--- disk after ---"
          df -h . | tail -1

      - name: Verify the LAN address is baked in
        shell: bash
        env:
          IB_DIR: ${{ steps.cfg.outputs.ib_dir }}
          LAN_IP_IN: ${{ steps.cfg.outputs.lan_ip }}
        run: |
          set -euo pipefail

          # make image 会把 FILES 覆盖层拷进它准备 rootfs 的暂存目录
          # （include/rootfs.mk 的 prepare_rootfs 里就是一句 file_copy），
          # 该目录构建后仍在原处。在这里查一遍，等于在打包前确认覆盖层真的落位 ——
          # FILES 路径写错、占位符漏替换，都会在这步暴露，而不是等设备起来后发现
          # 还是 192.168.1.1。
          f="$(find "ib/${IB_DIR}" -type f -path '*/etc/uci-defaults/99-lan-ip' \
                 -print -quit 2>/dev/null || true)"
          if [ -z "$f" ]; then
            echo "::error::镜像暂存 rootfs 里找不到 etc/uci-defaults/99-lan-ip —— FILES 覆盖层没有生效"
            echo "--- ib/${IB_DIR} 下的 rootfs 暂存目录 ---"
            find "ib/${IB_DIR}" -maxdepth 4 -type d -name 'root-*' -print 2>/dev/null || true
            exit 1
          fi
          echo "found: ${f}"
          echo "--- 内容 ---"
          sed 's/^/    /' "$f"
          # 覆盖层写的是 `add_list network.lan.ipaddr="<地址>/${prefix}"`：
          # 形态必须与 config_generate 一致（list + CIDR），所以这里只断言地址部分。
          if ! grep -q "network.lan.ipaddr=\"${LAN_IP_IN}/" "$f"; then
            echo "::error::覆盖层里的 LAN 地址不是 ${LAN_IP_IN}"
            exit 1
          fi
          echo "已确认：出厂 LAN 地址 ${LAN_IP_IN} 写进了镜像的 /etc/uci-defaults/99-lan-ip"

      - name: Collect release artifacts
        id: art
        shell: bash
        env:
          TARGET_DIR: ${{ steps.cfg.outputs.target }}
          SUBTARGET_DIR: ${{ steps.cfg.outputs.subtarget }}
          VARIANT: ${{ steps.cfg.outputs.release_variant }}
        run: |
          set -euo pipefail
          mkdir -p out

          bin="ib/${{ steps.cfg.outputs.ib_dir }}/bin/targets/${TARGET_DIR}/${SUBTARGET_DIR}"
          echo "--- everything that was built ---"
          find "$bin" -maxdepth 1 -type f -printf '%12s  %f\n' | sort -k2 || true

          # 变体名取自 config/<arch>.conf 的 RELEASE_VARIANT：
          #   x86_64 -> ext4-combined-efi      r2s -> ext4-sysupgrade
          # 它已带文件系统前缀，因此无需再排除 squashfs；匹配到多个就报错，
          # 免得静默挑中另一个变体。
          mapfile -t hits < <(find "$bin" -maxdepth 1 -type f \
                                -name "*-${VARIANT}.img.gz" -printf '%f\n' | sort)
          if [ "${#hits[@]}" -eq 0 ]; then
            echo "::error::no image matching *-${VARIANT}.img.gz was produced"
            exit 1
          fi
          if [ "${#hits[@]}" -gt 1 ]; then
            echo "::error::${#hits[@]} images match *-${VARIANT}.img.gz, expected exactly one:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          img="${hits[0]}"

          # 镜像尾部可能带 fwtool 元数据（由 append-metadata 写入）：
          #   * x86 的 SUPPORTED_DEVICES 为空 ⇒ 不追加 ⇒ 纯 gzip 流，gzip -t 返回 0
          #   * rockchip 的 SUPPORTED_DEVICES 有值 ⇒ 追加 ⇒ gzip 提示
          #     "trailing garbage ignored" 并以 2 退出（但流本身仍然完整）
          # 所以「rc=2 且明确说 decompression OK」不能当成损坏，否则 rockchip
          # 这类设备级镜像会被永远判失败。
          rc=0
          gzip -t "$bin/$img" 2> gzip-check.err || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "gzip integrity OK: ${img}   (纯 gzip 流)"
          elif [ "$rc" -eq 2 ] && grep -q 'decompression OK' gzip-check.err; then
            echo "gzip integrity OK: ${img}   (gzip 流完整，尾部为 fwtool 元数据)"
            sed 's/^/      /' gzip-check.err
            # 注意用 >/dev/null 而不是 grep -q：-q 命中后会提前退出，
            # 让上游 tail 收到 SIGPIPE，在 pipefail 下会把整条判定判成失败。
            if tail -c 8192 "$bin/$img" | grep -a 'supported_devices' >/dev/null; then
              echo "      尾部元数据含 supported_devices —— sysupgrade 可据此校验设备"
            else
              echo "::error::尾部有数据但不是 fwtool 元数据（未找到 supported_devices）"
              exit 1
            fi
          else
            echo "::error::gzip 完整性检查失败 (rc=${rc})"
            cat gzip-check.err || true
            exit 1
          fi

          cp -v "$bin/$img" out/
          manifest="$(find "$bin" -maxdepth 1 -type f -name '*.manifest' -printf '%f\n' | head -1)"
          [ -z "$manifest" ] || cp -v "$bin/$manifest" out/

          cd out
          sha256sum "$img" > "${img}.sha256"
          bytes="$(stat -c%s "$img")"
          {
            echo "img=${img}"
            echo "bytes=${bytes}"
            echo "sha256=$(cut -d' ' -f1 "${img}.sha256")"
            echo "manifest=${manifest}"
          } >> "$GITHUB_OUTPUT"
          echo "--- release payload ---"
          ls -la

      - name: Verify the custom packages are in the image
        if: steps.custom.outputs.custom_pkgs != ''
        shell: bash
        env:
          CUSTOM: ${{ steps.custom.outputs.custom_pkgs }}
          MANIFEST: out/${{ steps.art.outputs.manifest }}
        run: |
          set -euo pipefail
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::expected a manifest at ${MANIFEST}"
            ls -la out
            exit 1
          fi

          # 只有真正装进 rootfs 的包才会出现在 manifest 里，所以这是「自建包确实
          # 拼进镜像」的实证，比只看构建日志靠谱：包没被索引、依赖解析失败、
          # 架构不对，都会在这里暴露。
          #
          # CUSTOM 里每项是 name=version（抓包脚本钉死了版本），manifest 是
          # `name - version`（scripts/make-index-json.py 的 --manifest 输出）。
          # 必须连版本一起断言：packages/ 只是 apk 的又一个仓库，同名包在官方
          # feed 里也有、且版本号排序更高时，apk 会静默选 feed 那个 ——
          # 只查名字的话这种情况完全看不出来（luci-app-natmap 就是这样被盖住的）。
          missing=0
          for p in $CUSTOM; do
            name="${p%%=*}"
            want=""
            case "$p" in
              *=*) want="${p#*=}" ;;
            esac

            line="$(grep -m1 "^${name} " "$MANIFEST" || true)"
            if [ -z "$line" ]; then
              echo "::error::${name} 不在镜像 manifest 里 —— 没有装进 rootfs"
              missing=1
              continue
            fi
            if [ -n "$want" ] && [ "$line" != "${name} - ${want}" ]; then
              echo "::error::${name} 装的是「${line}」，不是我们抓的 ${want}"
              echo "::error::  多半是官方 feed 里有同名包且版本号排序更高，被它盖住了；"
              echo "::error::  确认 CUSTOM_PKGS 里的 pin（name=version）真的传给了 make image"
              missing=1
              continue
            fi
            echo "  in manifest: ${line}"
          done
          if [ "$missing" -ne 0 ]; then
            echo "--- manifest 里与这些名字相近的行 ---"
            for p in $CUSTOM; do grep -i -- "${p%%=*}" "$MANIFEST" | head -n 3 || true; done
            exit 1
          fi
          echo "全部 ${CUSTOM} 都已在镜像 manifest 中，且版本与抓到的完全一致"

      - name: Upload build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ steps.cfg.outputs.tag }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            out/*.manifest
            out/*.sha256
            ib/${{ steps.cfg.outputs.ib_dir }}/build.log

      - name: Publish release
        if: steps.cfg.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cfg.outputs.tag }}
          VER: ${{ steps.cfg.outputs.version }}
          ARCH: ${{ steps.cfg.outputs.arch }}
          TARGET_OUT: ${{ steps.cfg.outputs.target }}
          SUBTARGET_OUT: ${{ steps.cfg.outputs.subtarget }}
          PROFILE_OUT: ${{ steps.cfg.outputs.profile }}
          SIZE_OUT: ${{ steps.cfg.outputs.rootfs_size }}
          FS_OUT: ${{ steps.cfg.outputs.rootfs_fs }}
          VARIANT_OUT: ${{ steps.cfg.outputs.release_variant }}
          VARIANT_DESC_OUT: ${{ steps.cfg.outputs.variant_desc }}
          FLASH_HINT_OUT: ${{ steps.cfg.outputs.flash_hint }}
          EXTRA_OUT: ${{ steps.cfg.outputs.extra_image_name }}
          LAN_IP_OUT: ${{ steps.cfg.outputs.lan_ip }}
          MANIFEST: ${{ steps.art.outputs.manifest }}
          IMG: ${{ steps.art.outputs.img }}
          BYTES: ${{ steps.art.outputs.bytes }}
          SHA: ${{ steps.art.outputs.sha256 }}
        run: |
          set -euo pipefail

          human="$(awk -v b="$BYTES" 'BEGIN { printf "%.1f MiB", b / 1048576 }')"

          pkgcount="n/a"
          if [ -n "${MANIFEST:-}" ] && [ -f "out/${MANIFEST}" ]; then
            pkgcount="$(wc -l < "out/${MANIFEST}" | tr -d '[:space:]')"
          fi

          {
            echo "OpenWrt ${VER} 的 ${TARGET_OUT}/${SUBTARGET_OUT} 自建镜像，由官方 ImageBuilder 产出。"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| OpenWrt 版本 | ${VER} |"
            echo "| target | ${TARGET_OUT}/${SUBTARGET_OUT} |"
            echo "| profile | ${PROFILE_OUT} |"
            echo "| 根文件系统 | ${FS_OUT} |"
            echo "| rootfs 分区 | ${SIZE_OUT} MiB |"
            echo "| 镜像变体 | ${VARIANT_DESC_OUT} |"
            echo "| 出厂 LAN 地址 | ${LAN_IP_OUT} |"
            echo "| 已安装软件包 | ${pkgcount} 个 |"
            echo "| 文件 | ${IMG} |"
            echo "| 大小 | ${human} |"
            echo "| sha256 | ${SHA} |"
            echo
            echo "${FLASH_HINT_OUT}；已是 OpenWrt 系统时用 \`sysupgrade\` 刷入。"
            echo "rootfs 分区保持 ${SIZE_OUT} MiB 不变，可从任意同规格自制镜像增量升级并保留配置。"
            echo "首次启动后 LAN 地址为 ${LAN_IP_OUT}（管理页 http://${LAN_IP_OUT}/）；该地址只在仍是出厂默认时才会被设置，用户改过的不动。"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md
          echo "-----------------------------"

          title="OpenWrt ${VER} ${ARCH} (${FS_OUT} ${SIZE_OUT} MiB, ${VARIANT_OUT})"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists - replacing its asset"
            gh release upload "$TAG" "out/${IMG}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "out/${IMG}" \
              --title "$title" \
              --notes-file RELEASE_NOTES.md
          fi

          echo "--- release summary ---"
          gh release view "$TAG"
