name: 每周检查 OpenWrt 上游版本

# 触发方式：
#   1. 定时 —— 每周一探测一次 downloads.openwrt.org 的最新稳定版，周四再兜底探测一次。
#   2. 手动 —— Actions 页面 "Run workflow"；上游没有新版本时勾 force 可重建当前版本。
#
# 为什么两条 cron、且都不在整点：
#   GitHub 文档写明 schedule 事件在整点高负载时「排队的任务可能被丢弃」——不是延迟，
#   是根本不派发。另一个仓库首版写 `0 2 * * 1`，那天 02:00 UTC 一次 run 都没产生。
#   所以主探测放 02:17 UTC，另加一条周四兜底；脚本本身幂等，没更新就空跑退出。
#
# 跟进范围：同 series 与跨 series 都跟，但闸门不同。
#   25.12.5 → 25.12.6 属 service release，包名、配置项、内核 ABI 都向后兼容，直接跟进。
#   25.12.x → 26.03.x 是新 series，target / 包集 / 内核大版本都可能变 —— 也跟，但
#   **跟进前必须先过「包集核对」**：按 config/<arch>.conf 的 PACKAGES 逐项查官方 feed，
#   再确认各 target 的 ImageBuilder 归档与索引都在。缺任何一项就整轮失败、不改版本号：
#   自动发一个装不上自建包（natmap / oxidns / mihomo）或缺 kmod 的镜像是没有意义的。
#   预发布版（rc / alpha / beta / snapshot / pre）一律不跟。
#
# 为什么架构清单不写在这里：
#   仓库约定「版本号与目标只在 config/ 下」—— config/<arch>.conf 是唯一事实源。
#   本文件从 config/*.conf 读 CONF_ARCH / TARGET / SUBTARGET / IB_ARCH_TAG / IB_HOST_TAG，
#   新增一个架构时不需要回来改这里。

on:
  schedule:
    # 主探测：每周一 02:17 UTC = 北京时间 10:17。刻意错开整点。
    - cron: '17 2 * * 1'
    # 兜底：每周四 18:47 UTC = 北京时间周五 02:47。周一那次若被丢弃，这里补上。
    - cron: '47 18 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: '上游没有新版本时也重建一次当前版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 提交 config/build.conf 并推送
  actions: write    # dispatch build-image.yml

# 定时与手动不要并发改写同一个 build.conf。
concurrency:
  group: upstream-check
  cancel-in-progress: false

env:
  BUILD_CONF: config/build.conf

jobs:
  check:
    name: 探测上游并跟进
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 读取架构清单（来自 config/*.conf）
        id: archs
        run: |
          set -eu
          OUT="$RUNNER_TEMP/archs.txt"
          : > "$OUT"
          for c in config/*.conf; do
            [ "$(basename "$c")" = "build.conf" ] && continue
            a=$(sed -n 's/^CONF_ARCH="\(.*\)"/\1/p'    "$c" | head -n1)
            t=$(sed -n 's/^TARGET="\(.*\)"/\1/p'       "$c" | head -n1)
            s=$(sed -n 's/^SUBTARGET="\(.*\)"/\1/p'    "$c" | head -n1)
            it=$(sed -n 's/^IB_ARCH_TAG="\(.*\)"/\1/p' "$c" | head -n1)
            ht=$(sed -n 's/^IB_HOST_TAG="\(.*\)"/\1/p' "$c" | head -n1)
            if [ -z "$a" ] || [ -z "$t" ] || [ -z "$it" ] || [ -z "$ht" ]; then
              echo "::error::${c} 缺 CONF_ARCH / TARGET / IB_ARCH_TAG / IB_HOST_TAG"
              exit 1
            fi
            echo "${a}|${t}|${s}|${it}|${ht}" >> "$OUT"
          done
          echo "--- 架构清单（CONF_ARCH|TARGET|SUBTARGET|IB_ARCH_TAG|IB_HOST_TAG）---"
          cat "$OUT"
          echo "count=$(wc -l < "$OUT")" >> "$GITHUB_OUTPUT"

      - name: 探测上游最新稳定版
        id: probe
        run: |
          set -eu

          CUR=$(sed -n 's/^VERSION="\(.*\)"/\1/p' "$BUILD_CONF" | head -n1 | tr -d ' ')
          [ -n "$CUR" ] || { echo "::error::读不到 ${BUILD_CONF} 的 VERSION"; exit 1; }
          CUR_SERIES=${CUR%.*}

          # stable_version 即当前稳定系列的最新正式版。API 失败宁可报错，
          # 不要当成「无更新」静默跳过。
          LATEST=$(curl -fsSL --retry 3 --retry-delay 5 \
            https://downloads.openwrt.org/.versions.json \
            | jq -r '.stable_version // empty')
          [ -n "$LATEST" ] || { echo "::error::.versions.json 里没有 stable_version"; exit 1; }

          # 只跟正式版：预发布版一律不碰。
          # stable_version 本该就是正式版，但上游/镜像把 rc 填进来的情况出现过，
          # 所以这里显式拦一道（不是靠下面那条正则"顺带"排除）。
          # 命中时给 warning 并跳过 —— 不 exit 1，否则预发布期间每周都会红一次。
          PRERELEASE=false
          case "$LATEST" in
            *-rc*|*-alpha*|*-beta*|*-snapshot*|*-pre*)
              PRERELEASE=true
              echo "::warning::上游 stable_version=${LATEST} 是预发布版，按「只跟正式版」跳过本次跟进"
              ;;
          esac

          # 正式版必须是干净的 x.y.z（再兜一道，防止出现 25.12.6.1 之类的怪格式）
          if [ "$PRERELEASE" = false ]; then
            echo "$LATEST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::stable_version 不是 x.y.z 形式: $LATEST"; exit 1; }
          fi
          LATEST_SERIES=${LATEST%.*}

          SAME_SERIES=false
          [ "$LATEST_SERIES" = "$CUR_SERIES" ] && SAME_SERIES=true

          # 只要「排序更大」就跟进：同 series 的 service release 直接跟；跨 series
          # 也跟，但后面多一道包集核对闸门。预发布版一律不跟。
          # 用 sort -V 比较而不是字符串比较，避免 25.12.10 被 25.12.9 判成更小；
          # 同时保证上游回退（或本仓库超前）时不会把自己降级。
          NEWER=false
          if [ "$PRERELEASE" = false ] && [ "$LATEST" != "$CUR" ] && \
             [ "$(printf '%s\n%s\n' "$CUR" "$LATEST" | sort -V | tail -n1)" = "$LATEST" ]; then
            NEWER=true
          fi

          {
            echo "### OpenWrt 上游版本探测"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 当前 VERSION | \`${CUR}\` |"
            echo "| 上游 stable_version | \`${LATEST}\` |"
            echo "| 是否预发布版（跳过） | ${PRERELEASE} |"
            echo "| 同 series | ${SAME_SERIES} |"
            echo "| 需要跟进 | ${NEWER} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SAME_SERIES" = false ] && [ "$NEWER" = true ]; then
            echo "::notice::跨 series 升级（${CUR_SERIES} -> ${LATEST_SERIES}）：跟进前会先核对包集与产物"
          fi

          echo "current=${CUR}"             >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}"           >> "$GITHUB_OUTPUT"
          echo "newer=${NEWER}"             >> "$GITHUB_OUTPUT"
          echo "same_series=${SAME_SERIES}" >> "$GITHUB_OUTPUT"

      - name: 确认就位并核对 ImageBuilder 命名（以上游真实文件名为准）
        id: naming
        if: steps.probe.outputs.newer == 'true'
        env:
          LATEST: ${{ steps.probe.outputs.latest }}
        run: |
          set -eu
          # 不拿 config 里的 IB_ARCH_TAG 去"猜"文件名 —— 上游的命名规则变过
          # （x86_64 → x86-64 就发生在 25.12.x 期间）。这里直接列上游目录，从
          # **真实文件名**里取出 <arch_tag>.<host_tag>，再和 config 对比：
          #   · 一致   → 什么都不做
          #   · 不一致 → 改写 config（否则 build-image.yml 下载 IB 时必然 404）
          #   · 找不到 → 报错退出：版本/目录不对，或上游改了产物命名，得人看
          changed=0
          while IFS='|' read -r a t s it ht; do
            [ -n "$a" ] || continue
            dir="https://downloads.openwrt.org/releases/${LATEST}/targets/${t}/${s}"
            echo "::group::${a}   (${t}/${s})"

            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${dir}/sha256sums" || true)
            echo "  ${code}  ${dir}/sha256sums"
            if [ "$code" != "200" ]; then
              echo "::error::${LATEST} 的 ${t}/${s} 索引不存在（${code}），本次不跟进"
              exit 1
            fi

            html=$(curl -fsSL --max-time 60 "${dir}/" || true)
            actual=$(printf '%s' "$html" \
              | grep -oE "openwrt-imagebuilder-${LATEST//./\\.}-[A-Za-z0-9._-]+\.tar\.zst" \
              | head -n1)
            if [ -z "$actual" ]; then
              echo "::error::在 ${dir}/ 里找不到 openwrt-imagebuilder-${LATEST}-*.tar.zst"
              echo "::error::上游可能改了产物命名、或该 target 还没出 ImageBuilder，需人工确认"
              exit 1
            fi
            echo "  上游实际: ${actual}"

            # 形如 openwrt-imagebuilder-<ver>-<arch_tag>.<host_tag>.tar.zst
            pair=${actual#openwrt-imagebuilder-${LATEST}-}
            pair=${pair%.tar.zst}
            real_arch=${pair%.*}
            real_host=${pair##*.}

            echo "  config  : IB_ARCH_TAG=${it}   IB_HOST_TAG=${ht}"
            echo "  上游    : IB_ARCH_TAG=${real_arch}   IB_HOST_TAG=${real_host}"
            if [ "$real_arch" != "$it" ] || [ "$real_host" != "$ht" ]; then
              echo "::warning::${a} 的 ImageBuilder 命名与 config 不一致，按上游改写（否则 build-image.yml 会 404）"
              sed -i "s|^IB_ARCH_TAG=\".*\"|IB_ARCH_TAG=\"${real_arch}\"|" "config/${a}.conf"
              sed -i "s|^IB_HOST_TAG=\".*\"|IB_HOST_TAG=\"${real_host}\"|" "config/${a}.conf"
              changed=1
            fi

            # RELEASE_VARIANT 也跟上游核对：它是产物文件名的一部分
            # （openwrt-<ver>-<arch_tag>-<profile>-<variant>.img.gz），
            # 上游改命名的话，包集核对查不出来，只会在构建末尾 ImageBuilder
            # 找不到产物时才炸。这里提前断一次。
            # 注意只核对、不自动改：ext4 / squashfs 是我们的选择，不能替人决定。
            variant=$(sed -n 's/^RELEASE_VARIANT="\(.*\)"/\1/p' "config/${a}.conf" | head -n1)
            profile=$(sed -n 's/^PROFILE="\(.*\)"/\1/p'        "config/${a}.conf" | head -n1)
            [ -n "$variant" ] && [ -n "$profile" ] || { echo "::error::${a} 的 conf 缺 PROFILE 或 RELEASE_VARIANT"; exit 1; }

            want="openwrt-${LATEST}-${real_arch}-${profile}-${variant}.img.gz"
            if printf '%s' "$html" | grep -qF -- "$want"; then
              echo "  RELEASE_VARIANT=${variant}  ✓ 上游存在 ${want}"
            else
              echo "::error::上游不存在 ${want}（RELEASE_VARIANT=${variant} 可能已改名）"
              echo "::error::该 target 下实际存在的镜像变体："
              printf '%s' "$html" \
                | grep -oE "openwrt-${LATEST//./\\.}-[A-Za-z0-9_.-]+\.img\.gz" | sort -u \
                | head -n 20 | sed 's/^/    /'
              exit 1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/archs.txt"

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "1" ]; then
            echo "--- config 命名已更新，摘录 ---"
            grep -H '^IB_ARCH_TAG=\|^IB_HOST_TAG=' config/*.conf
          fi

      # ★ 跨 series 的主闸门。同 series 的 service release 跳过这一步（包集不会变）；
      # 跨大版本时必须先确认 config/<arch>.conf 里的每个包在新 feed 里还在 ——
      # 新 series 移除 / 改名包很常见。
      - name: 跨 series 时核对包集
        if: steps.probe.outputs.newer == 'true' && steps.probe.outputs.same_series == 'false'
        env:
          LATEST: ${{ steps.probe.outputs.latest }}
        run: |
          set -eu
          rc=0
          while IFS='|' read -r a _; do
            [ -n "$a" ] || continue
            echo "::group::check-packages ${a} ${LATEST}"
            # 非零即不通过；不 break，让每个架构的缺失项都打出来再一起判
            python3 scripts/check-packages.py "$a" "$LATEST" || rc=1
            echo "::endgroup::"
          done < "$RUNNER_TEMP/archs.txt"

          if [ "$rc" != 0 ]; then
            echo "::error::${LATEST} 下包集核对未通过（缺失项见上面各 group），本次不跟进、不改版本号"
            exit 1
          fi
          echo "包集核对通过：config 里各架构的 PACKAGES 在 ${LATEST} 下全部存在"

      - name: 改写 build.conf 并推送
        if: steps.probe.outputs.newer == 'true' || inputs.force
        env:
          LATEST: ${{ steps.probe.outputs.latest }}
        run: |
          set -eu

          if [ "${{ steps.probe.outputs.newer }}" = "true" ]; then
            sed -i "s|^VERSION=\".*\"|VERSION=\"${LATEST}\"|" "$BUILD_CONF"
          fi
          echo "--- 改写后 ---"
          grep -E '^VERSION=|^ARCH=' "$BUILD_CONF"

          # 上一步可能改过 config/<arch>.conf 的 IB_ARCH_TAG / IB_HOST_TAG，
          # 所以这里整个 config/ 一起看，不能只盯 build.conf。
          if git diff --quiet -- config/; then
            echo "版本与构建参数都没变化（force 模式）：跳过提交，直接触发构建"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/
          git diff --cached --stat
          if [ "${{ steps.naming.outputs.changed }}" = "1" ]; then
            git commit -m "chore: 跟进 OpenWrt 上游 ${LATEST}（含 ImageBuilder 命名）"
          else
            git commit -m "chore: 跟进 OpenWrt 上游 ${LATEST}"
          fi
          git push origin HEAD:main

      - name: 触发各架构的构建与发布
        if: steps.probe.outputs.newer == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # 必须显式 dispatch：GITHUB_TOKEN 推送产生的 commit 不会触发 push 型
          # workflow（GitHub 防递归），不 dispatch 就等于只改了个版本号、什么都没构建。
          # 各架构在 build-image.yml 里共享 concurrency，会串行执行。
          while IFS='|' read -r a _; do
            [ -n "$a" ] || continue
            gh workflow run build-image.yml --ref main -f arch="$a"
            echo "已触发 build-image.yml  arch=${a}"
          done < "$RUNNER_TEMP/archs.txt"

      - name: 无新版本
        if: steps.probe.outputs.newer != 'true' && !inputs.force
        run: echo "上游稳定版与 build.conf 一致、更旧，或是预发布版（已跳过），本次不做改动。"
