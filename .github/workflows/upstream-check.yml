name: 每周检查 OpenWrt 上游版本

# 触发方式：
#   1. 定时 —— 每周一探测一次 downloads.openwrt.org 的最新稳定版，周四再兜底探测一次。
#   2. 手动 —— Actions 页面 "Run workflow"；上游没有新版本时勾 force 可重建当前版本。
#
# 为什么两条 cron、且都不在整点：
#   GitHub 文档写明 schedule 事件在整点高负载时「排队的任务可能被丢弃」——不是延迟，
#   是根本不派发。另一个仓库首版写 `0 2 * * 1`，那天 02:00 UTC 一次 run 都没产生。
#   所以主探测放 02:17 UTC，另加一条周四兜底；脚本本身幂等，没更新就空跑退出。
#
# 跟进范围：**只跟同一 series（major.minor 相同）**。
#   25.12.5 → 25.12.6 属 service release，包名、配置项、内核 ABI 都向后兼容，
#   可以自动跟进；25.12.x → 26.03.x 是新 series，target / 包集 / 内核大版本都可能变，
#   必须人工验证，本 workflow 不碰（打印 warning 后退出）。
#
# 为什么要先确认产物可用：
#   .versions.json 的 stable_version 往往比文件先更新。镜像站同步有延迟时，
#   直接改版本号会让构建在下载 IB 那一步失败。所以在改之前逐个 HEAD 检查
#   两个 target 的 sha256sums 与 ImageBuilder 归档，缺任何一个就等下次。

on:
  schedule:
    # 主探测：每周一 02:17 UTC = 北京时间 10:17。刻意错开整点。
    - cron: '17 2 * * 1'
    # 兜底：每周四 18:47 UTC = 北京时间周五 02:47。周一那次若被丢弃，这里补上。
    - cron: '47 18 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: '上游没有新版本时也重建一次当前版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 提交 config/build.conf 并推送
  actions: write    # dispatch build-image.yml

# 定时与手动不要并发改写同一个 build.conf。
concurrency:
  group: upstream-check
  cancel-in-progress: false

env:
  BUILD_CONF: config/build.conf

jobs:
  check:
    name: 探测上游并跟进
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 探测上游最新稳定版
        id: probe
        run: |
          set -eu

          CUR=$(sed -n 's/^VERSION="\(.*\)"/\1/p' "$BUILD_CONF" | head -n1 | tr -d ' ')
          [ -n "$CUR" ] || { echo "::error::读不到 ${BUILD_CONF} 的 VERSION"; exit 1; }
          CUR_SERIES=${CUR%.*}

          # stable_version 即当前稳定系列的最新正式版。API 失败宁可报错，
          # 不要当成「无更新」静默跳过。
          LATEST=$(curl -fsSL --retry 3 --retry-delay 5 \
            https://downloads.openwrt.org/.versions.json \
            | jq -r '.stable_version // empty')
          [ -n "$LATEST" ] || { echo "::error::.versions.json 里没有 stable_version"; exit 1; }

          # 只跟正式版：预发布版一律不碰。
          # stable_version 本该就是正式版，但上游/镜像把 rc 填进来的情况出现过，
          # 所以这里显式拦一道（不是靠下面那条正则"顺带"排除）。
          # 命中时给 warning 并跳过 —— 不 exit 1，否则预发布期间每周都会红一次。
          PRERELEASE=false
          case "$LATEST" in
            *-rc*|*-alpha*|*-beta*|*-snapshot*|*-pre*)
              PRERELEASE=true
              echo "::warning::上游 stable_version=${LATEST} 是预发布版，按「只跟正式版」跳过本次跟进"
              ;;
          esac

          # 正式版必须是干净的 x.y.z（再兜一道，防止出现 25.12.6.1 之类的怪格式）
          if [ "$PRERELEASE" = false ]; then
            echo "$LATEST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::stable_version 不是 x.y.z 形式: $LATEST"; exit 1; }
          fi
          LATEST_SERIES=${LATEST%.*}

          SAME_SERIES=false
          [ "$LATEST_SERIES" = "$CUR_SERIES" ] && SAME_SERIES=true

          # 只在「同 series 且排序更大」时跟进：既避免跨大版本乱跳，也避免上游回退
          # （或本仓库超前）时把自己降级。预发布版直接判为不跟进。
          NEWER=false
          if [ "$PRERELEASE" = false ] && [ "$SAME_SERIES" = true ] && [ "$LATEST" != "$CUR" ] && \
             [ "$(printf '%s\n%s\n' "$CUR" "$LATEST" | sort -V | tail -n1)" = "$LATEST" ]; then
            NEWER=true
          fi

          CROSS_SERIES=false
          if [ "$PRERELEASE" = false ] && [ "$LATEST_SERIES" != "$CUR_SERIES" ] && \
             [ "$(printf '%s\n%s\n' "$CUR_SERIES" "$LATEST_SERIES" | sort -V | tail -n1)" = "$LATEST_SERIES" ]; then
            CROSS_SERIES=true
          fi

          {
            echo "### OpenWrt 上游版本探测"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 当前 VERSION | \`${CUR}\` |"
            echo "| 上游 stable_version | \`${LATEST}\` |"
            echo "| 是否预发布版（跳过） | ${PRERELEASE} |"
            echo "| 同 series | ${SAME_SERIES} |"
            echo "| 需要跟进 | ${NEWER} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CROSS_SERIES" = true ]; then
            echo "::warning::上游已进入新 series ${LATEST_SERIES}（当前 ${CUR_SERIES}）。跨大版本不自动跟，请人工验证 target/包集/内核后再改 VERSION"
          fi

          echo "current=${CUR}"       >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}"     >> "$GITHUB_OUTPUT"
          echo "newer=${NEWER}"       >> "$GITHUB_OUTPUT"
          echo "same_series=${SAME_SERIES}" >> "$GITHUB_OUTPUT"

      - name: 确认该版本的两个 target 已在下载站就位
        if: steps.probe.outputs.newer == 'true'
        env:
          LATEST: ${{ steps.probe.outputs.latest }}
        run: |
          set -eu
          # 这就是上面注释说的「先确认产物可用」：4 条路径全部 200 才继续，
          # 否则直接失败退出（本周不跟进，下周再来）。
          for p in \
            "releases/${LATEST}/targets/x86/64/sha256sums" \
            "releases/${LATEST}/targets/rockchip/armv8/sha256sums" \
            "releases/${LATEST}/targets/x86/64/openwrt-imagebuilder-${LATEST}-x86-64.Linux-x86_64.tar.zst" \
            "releases/${LATEST}/targets/rockchip/armv8/openwrt-imagebuilder-${LATEST}-rockchip-armv8.Linux-x86_64.tar.zst" ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                     "https://downloads.openwrt.org/${p}" || true)
            echo "  ${code}  ${p}"
            if [ "$code" != "200" ]; then
              echo "::error::${LATEST} 的产物尚未在下载站就位（${p} -> ${code}），本次不跟进"
              exit 1
            fi
          done

      - name: 改写 build.conf 并推送
        if: steps.probe.outputs.newer == 'true' || inputs.force
        env:
          LATEST: ${{ steps.probe.outputs.latest }}
        run: |
          set -eu

          if [ "${{ steps.probe.outputs.newer }}" = "true" ]; then
            sed -i "s|^VERSION=\".*\"|VERSION=\"${LATEST}\"|" "$BUILD_CONF"
          fi
          echo "--- 改写后 ---"
          grep -E '^VERSION=|^ARCH=' "$BUILD_CONF"

          if git diff --quiet -- "$BUILD_CONF"; then
            echo "版本未变化（force 模式）：跳过提交，直接触发构建"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BUILD_CONF"
          git commit -m "chore: 跟进 OpenWrt 上游 ${LATEST}"
          git push origin HEAD:main

      - name: 触发两个架构的构建与发布
        if: steps.probe.outputs.newer == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # 必须显式 dispatch：GITHUB_TOKEN 推送产生的 commit 不会触发 push 型
          # workflow（GitHub 防递归），不 dispatch 就等于只改了个版本号、什么都没构建。
          # 两个 arch 在 build-image.yml 里共享 concurrency，会串行执行。
          for a in x86_64 r2s; do
            gh workflow run build-image.yml --ref main -f arch="$a"
            echo "已触发 build-image.yml  arch=${a}"
          done

      - name: 无新版本
        if: steps.probe.outputs.newer != 'true' && !inputs.force
        run: echo "上游稳定版与 build.conf 一致、更旧，或属跨 series（已跳过），本次不做改动。"
